asyncapi: 3.0.0
x-ballerina-event-identifier:
  type: body
  path: event.type
# Slack signs `v0:<X-Slack-Request-Timestamp>:<body>` with HMAC-SHA256 keyed by the app's Signing Secret, sends it
# as `X-Slack-Signature: v0=<hex>`, and recommends rejecting requests more than five minutes old.
x-ballerina-auth:
  header: X-Slack-Signature
  signature:
    algorithm: sha256
    encoding: hex
    headerFormat: "v0=$signature"
    input: "'v0' . ':' . $header('X-Slack-Request-Timestamp') . ':' . $body"
  freshness:
    header: X-Slack-Request-Timestamp
    toleranceMillis: 300000
    unit: seconds
info:
  contact:
    email: developers@slack.com
    name: Slack Platform Support
    url: https://api.slack.com/support
  description: A webhook-based events bus using a subscription model for Slack apps
  termsOfService: https://slack.com/terms-of-service/api
  title: Slack Events API
  version: 1.0.0
  externalDocs:
    description: Slack Events API documentation
    url: https://docs.slack.dev/apis/events-api/
defaultContentType: application/json
