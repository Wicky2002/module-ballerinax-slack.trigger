components:
  schemas:
    GenericEventWrapper:
      additionalProperties: true
      description: >-
        The wrapper Slack posts every Events API event in. Fields as in the "Callback field overview" of
        https://docs.slack.dev/apis/events-api/.
      properties:
        api_app_id:
          description: ' Use this to distinguish which app the event belongs to if you use multiple apps with the same Request URL.'
          title: The unique identifier your installed Slack application.
          type: string
          x-examples:
            - A2H9RFS1A
        event:
          additionalProperties: true
          properties:
            event_ts:
              title: When the event was dispatched
              type: string
            type:
              title: The specific name of the event
              type: string
            text:
              title: The message content
              type: string
          required:
            - type
          title: The actual event, an object, that happened
          type: object
