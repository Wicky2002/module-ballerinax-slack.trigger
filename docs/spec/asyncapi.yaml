    MessageEvent:
      additionalProperties: true
      description: >-
        A message posted to a channel, private channel, DM, group DM or the app's home. `channel_type` tells them
        apart (`channel`, `group`, `im`, `mpim`, `app_home`), and `subtype` marks special messages such as
        `message_changed`, `message_deleted` or `bot_message`.
      properties:
        type:
          type: string
          description: Always `message`.
        subtype:
          type: string
          description: The kind of special message, absent for an ordinary message.
        channel:
          type: string
          description: The ID of the conversation the message was posted in.
        channel_type:
          type: string
          description: The type of conversation, `channel`, `group`, `im`, `mpim` or `app_home`.
        user:
          type: string
          description: The ID of the user who sent the message. Absent for some subtypes.
        bot_id:
          type: string
          description: The ID of the bot that sent the message, for bot messages.
        text:
          type: string
          description: The text of the message.
        ts:
          type: string
          description: The message's unique timestamp within the conversation.
        thread_ts:
          type: string
          description: The timestamp of the thread's parent message, for a message in a thread.
        event_ts:
          type: string
          description: When the event was dispatched.
        hidden:
          type: boolean
          description: Whether the message is hidden from the conversation, as for some subtypes.
        deleted_ts:
          type: string
          description: The timestamp of the deleted message, for `message_deleted`.
        edited:
          type: object
          description: Who edited the message and when, for an edited message.
          additionalProperties: true
          properties:
            user:
              type: string
              description: The ID of the user who edited the message.
            ts:
              type: string
              description: When the message was edited.
        message:
          type: object
          description: The message after the change, for `message_changed`.
          additionalProperties: true
        previous_message:
          type: object
          description: The message before the change, for `message_changed` and `message_deleted`.
          additionalProperties: true
      required:
        - type
        - channel
        - ts
      type: object
